<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 450" fill="none">
  <!-- White Background -->
  <rect width="350" height="450" fill="#FFFFFF"/>

  <!-- Body/Shoulders - Dark Suit -->
  <ellipse cx="175" cy="480" rx="130" ry="90" fill="#1E293B"/>

  <!-- White Shirt -->
  <path d="M145 355 L155 450 L195 450 L205 355 L185 345 L175 350 L165 345 Z" fill="white"/>

  <!-- Tie -->
  <path d="M175 350 L165 365 L175 450 L185 365 Z" fill="#334155"/>

  <!-- Suit Lapels -->
  <path d="M115 355 L145 345 L160 450 L90 450 Z" fill="#1E293B"/>
  <path d="M235 355 L205 345 L190 450 L260 450 Z" fill="#1E293B"/>

  <!-- Neck -->
  <rect x="145" y="290" width="60" height="60" fill="#F5D6C6"/>

  <!-- Face -->
  <ellipse cx="175" cy="195" rx="85" ry="105" fill="#F5D6C6"/>

  <!-- Hair -->
  <ellipse cx="175" cy="125" rx="90" ry="75" fill="#1C1917"/>
  <path d="M90 155 Q85 200 95 230" fill="#1C1917"/>
  <path d="M260 155 Q265 200 255 230" fill="#1C1917"/>

  <!-- Ears -->
  <ellipse cx="90" cy="205" rx="14" ry="24" fill="#F0C9B8"/>
  <ellipse cx="260" cy="205" rx="14" ry="24" fill="#F0C9B8"/>

  <!-- Eyes -->
  <ellipse cx="135" cy="195" rx="18" ry="12" fill="white"/>
  <ellipse cx="215" cy="195" rx="18" ry="12" fill="white"/>
  <ellipse cx="135" cy="197" rx="10" ry="10" fill="#1C1917"/>
  <ellipse cx="215" cy="197" rx="10" ry="10" fill="#1C1917"/>
  <ellipse cx="138" cy="194" rx="4" ry="4" fill="white"/>
  <ellipse cx="218" cy="194" rx="4" ry="4" fill="white"/>

  <!-- Eyebrows -->
  <path d="M110 172 Q135 165 158 174" stroke="#1C1917" stroke-width="4" fill="none"/>
  <path d="M192 174 Q215 165 240 172" stroke="#1C1917" stroke-width="4" fill="none"/>

  <!-- Nose -->
  <path d="M175 200 L170 240 Q175 250 180 240 L175 200" fill="#E8C4B4"/>

  <!-- Mouth - Neutral -->
  <path d="M150 275 Q175 280 200 275" stroke="#B8786A" stroke-width="3" fill="none"/>
</svg>

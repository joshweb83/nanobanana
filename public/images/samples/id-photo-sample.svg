<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <!-- Light Blue Background -->
  <rect width="300" height="400" fill="#E0F2FE"/>

  <!-- Body/Shoulders - Navy Suit -->
  <ellipse cx="150" cy="420" rx="120" ry="80" fill="#1E3A5F"/>

  <!-- White Shirt -->
  <path d="M120 310 L130 400 L170 400 L180 310 L165 300 L150 305 L135 300 Z" fill="white"/>

  <!-- Tie -->
  <path d="M150 305 L142 318 L150 400 L158 318 Z" fill="#DC2626"/>

  <!-- Suit Lapels -->
  <path d="M95 315 L120 300 L135 400 L75 400 Z" fill="#1E3A5F"/>
  <path d="M205 315 L180 300 L165 400 L225 400 Z" fill="#1E3A5F"/>

  <!-- Neck -->
  <rect x="120" y="260" width="60" height="50" fill="#F5D6C6"/>

  <!-- Face -->
  <ellipse cx="150" cy="180" rx="75" ry="95" fill="#F5D6C6"/>

  <!-- Hair -->
  <ellipse cx="150" cy="115" rx="78" ry="68" fill="#292524"/>
  <path d="M75 145 Q70 185 82 215" fill="#292524"/>
  <path d="M225 145 Q230 185 218 215" fill="#292524"/>

  <!-- Ears -->
  <ellipse cx="75" cy="190" rx="12" ry="20" fill="#F0C9B8"/>
  <ellipse cx="225" cy="190" rx="12" ry="20" fill="#F0C9B8"/>

  <!-- Eyes -->
  <ellipse cx="115" cy="180" rx="16" ry="11" fill="white"/>
  <ellipse cx="185" cy="180" rx="16" ry="11" fill="white"/>
  <ellipse cx="115" cy="182" rx="9" ry="9" fill="#292524"/>
  <ellipse cx="185" cy="182" rx="9" ry="9" fill="#292524"/>
  <ellipse cx="117" cy="179" rx="4" ry="4" fill="white"/>
  <ellipse cx="187" cy="179" rx="4" ry="4" fill="white"/>

  <!-- Eyebrows -->
  <path d="M95 160 Q115 153 137 162" stroke="#292524" stroke-width="4" fill="none"/>
  <path d="M163 162 Q185 153 205 160" stroke="#292524" stroke-width="4" fill="none"/>

  <!-- Nose -->
  <path d="M150 185 L145 218 Q150 226 155 218 L150 185" fill="#E8C4B4"/>

  <!-- Mouth -->
  <path d="M130 250 Q150 256 170 250" stroke="#B8786A" stroke-width="2.5" fill="none"/>
</svg>

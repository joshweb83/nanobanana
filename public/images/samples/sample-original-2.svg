<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <!-- Background - outdoor/casual -->
  <rect width="300" height="400" fill="#87CEEB"/>
  <rect y="350" width="300" height="50" fill="#90EE90"/>

  <!-- Body/Shoulders -->
  <ellipse cx="150" cy="420" rx="110" ry="75" fill="#EC4899"/>

  <!-- Neck -->
  <rect x="125" y="265" width="50" height="45" fill="#F5D6C6"/>

  <!-- Face -->
  <ellipse cx="150" cy="185" rx="70" ry="90" fill="#F5D6C6"/>

  <!-- Long Hair -->
  <ellipse cx="150" cy="130" rx="85" ry="75" fill="#4A3728"/>
  <ellipse cx="70" cy="200" rx="30" ry="80" fill="#4A3728"/>
  <ellipse cx="230" cy="200" rx="30" ry="80" fill="#4A3728"/>
  <ellipse cx="80" cy="300" rx="25" ry="60" fill="#4A3728"/>
  <ellipse cx="220" cy="300" rx="25" ry="60" fill="#4A3728"/>

  <!-- Ears - partially hidden by hair -->
  <ellipse cx="82" cy="190" rx="10" ry="18" fill="#F0C9B8"/>
  <ellipse cx="218" cy="190" rx="10" ry="18" fill="#F0C9B8"/>

  <!-- Eyes -->
  <ellipse cx="120" cy="185" rx="14" ry="10" fill="white"/>
  <ellipse cx="180" cy="185" rx="14" ry="10" fill="white"/>
  <ellipse cx="120" cy="187" rx="7" ry="7" fill="#4A3728"/>
  <ellipse cx="180" cy="187" rx="7" ry="7" fill="#4A3728"/>
  <ellipse cx="122" cy="184" rx="3" ry="3" fill="white"/>
  <ellipse cx="182" cy="184" rx="3" ry="3" fill="white"/>

  <!-- Eyebrows -->
  <path d="M100 165 Q120 160 138 167" stroke="#4A3728" stroke-width="3" fill="none"/>
  <path d="M162 167 Q180 160 200 165" stroke="#4A3728" stroke-width="3" fill="none"/>

  <!-- Nose -->
  <path d="M150 190 L146 218 Q150 225 154 218 L150 190" fill="#E8C4B4"/>

  <!-- Mouth - smile -->
  <path d="M125 250 Q150 262 175 250" stroke="#D4847A" stroke-width="3" fill="none"/>

  <!-- Casual top neckline -->
  <path d="M110 295 Q150 315 190 295" fill="#EC4899"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E7FF"/>
      <stop offset="100%" style="stop-color:#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Body/Shoulders - Smart Casual -->
  <ellipse cx="200" cy="450" rx="140" ry="90" fill="#1E3A8A"/>

  <!-- Shirt collar visible -->
  <path d="M170 320 Q200 340 230 320" fill="white"/>

  <!-- Neck -->
  <rect x="170" y="280" width="60" height="50" fill="#F5D6C6"/>

  <!-- Face -->
  <ellipse cx="200" cy="190" rx="90" ry="110" fill="#F5D6C6"/>

  <!-- Hair - Modern style -->
  <ellipse cx="200" cy="115" rx="95" ry="75" fill="#44403C"/>
  <path d="M110 155 Q105 200 118 240" fill="#44403C"/>
  <path d="M290 155 Q295 200 282 240" fill="#44403C"/>

  <!-- Ears -->
  <ellipse cx="110" cy="200" rx="14" ry="24" fill="#F0C9B8"/>
  <ellipse cx="290" cy="200" rx="14" ry="24" fill="#F0C9B8"/>

  <!-- Eyes - Friendly -->
  <ellipse cx="160" cy="190" rx="18" ry="13" fill="white"/>
  <ellipse cx="240" cy="190" rx="18" ry="13" fill="white"/>
  <ellipse cx="160" cy="193" rx="10" ry="10" fill="#44403C"/>
  <ellipse cx="240" cy="193" rx="10" ry="10" fill="#44403C"/>
  <ellipse cx="163" cy="189" rx="4" ry="4" fill="white"/>
  <ellipse cx="243" cy="189" rx="4" ry="4" fill="white"/>

  <!-- Eyebrows -->
  <path d="M135 165 Q160 157 185 167" stroke="#44403C" stroke-width="4" fill="none"/>
  <path d="M215 167 Q240 157 265 165" stroke="#44403C" stroke-width="4" fill="none"/>

  <!-- Nose -->
  <path d="M200 195 L195 235 Q200 245 205 235 L200 195" fill="#E8C4B4"/>

  <!-- Mouth - Friendly smile -->
  <path d="M170 270 Q200 285 230 270" stroke="#C4786A" stroke-width="3" fill="none"/>
</svg>
